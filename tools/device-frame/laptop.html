<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.wrap{width:1600px;padding:24px 0 56px;display:flex;flex-direction:column;align-items:center}
.lid{width:1360px;padding:26px 26px 30px;background:linear-gradient(#202124,#0b0b0d);border-radius:28px 28px 6px 6px;
  box-shadow:inset 0 0 0 2px #3a3b3f, inset 0 0 0 4px #050506;position:relative}
.cam{position:absolute;top:10px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#1f2a35;box-shadow:0 0 0 2px #0a0a0b}
.screen{width:100%;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#000}
.screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.base{width:1560px;height:30px;margin-top:-1px;border-radius:2px 2px 26px 26px/2px 2px 22px 22px;
  background:linear-gradient(#f2f3f5 0%,#d4d6da 45%,#a9acb2 100%);position:relative;box-shadow:0 30px 40px -18px rgba(0,0,0,.45)}
.base:before{content:"";position:absolute;left:50%;top:0;width:230px;height:12px;margin-left:-115px;border-radius:0 0 14px 14px;background:linear-gradient(#b8bbc0,#d9dbdf)}
.base:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#8e9197;border-radius:2px}
</style></head><body><div class="wrap" id="w"><div class="lid"><div class="cam"></div><div class="screen"><img id="img"></div></div><div class="base"></div></div></body></html>
